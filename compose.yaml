name: proof-of-alpha
services:
  postgres:
    image: postgres:17.9-alpine@sha256:c7526c0f6c3f30260a563d7bcf8ad778effac59a44f8ffa86678c35418338609
    environment:
      POSTGRES_USER: poa
      POSTGRES_PASSWORD: poa-local-only
      POSTGRES_DB: poa
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U poa -d poa']
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    image: proof-of-alpha:m3-local
    command: ['pnpm', 'db:migrate']
    environment:
      DATABASE_URL: postgres://poa:poa-local-only@postgres:5432/poa
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: proof-of-alpha:m3-local
    command: ['pnpm', '--filter', '@poa/api', 'start']
    environment:
      DATABASE_URL: postgres://poa:poa-local-only@postgres:5432/poa
      API_PORT: '3001'
      POA_ENABLE_SYNTHETIC_M3: '${POA_ENABLE_SYNTHETIC_M3:-0}'
    ports:
      - '127.0.0.1:3001:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 4s
      retries: 20
  worker:
    image: proof-of-alpha:m3-local
    command: ['pnpm', '--filter', '@poa/worker', 'start']
    environment:
      DATABASE_URL: postgres://poa:poa-local-only@postgres:5432/poa
      POA_ENABLE_SYNTHETIC_M3: '${POA_ENABLE_SYNTHETIC_M3:-0}'
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    image: proof-of-alpha:m3-local
    command: ['pnpm', '--filter', '@poa/web', 'start']
    environment:
      API_INTERNAL_URL: http://api:3001
      NEXT_TELEMETRY_DISABLED: '1'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
